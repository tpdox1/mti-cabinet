{% extends "base.html" %}
{% block title %}Вход — МТИ{% endblock %}
{% block content %}
<section class="auth-wrap">
  <form class="card auth-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <span class="eyebrow">Личный кабинет МТИ</span>
    <h1>Вход</h1>
    <label>Email<input type="email" name="email" required autocomplete="email" placeholder="name@example.com"></label>
    <label>Пароль<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="button primary full" type="submit">Войти</button>
    <p class="muted center">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
  </form>
</section>
{% endblock %}
